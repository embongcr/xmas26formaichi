<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: {
                            950: '#061611',
                            900: '#0B241C',
                            800: '#113328',
                            700: '#184738',
                        },
                        gold: {
                            100: '#FBF5DF',
                            200: '#F3E5AB',
                            300: '#E6CE7D',
                            400: '#D4AF37',
                            500: '#B59024',
                            600: '#8E6F17',
                        },
                        ivory: {
                            50: '#FDFBF7',
                            100: '#FAF6F0',
                            200: '#F2ECE1',
                            300: '#E5DCCB',
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', '"Cormorant Garamond"', 'Georgia', 'serif'],

    <style>
        /* Luxury deep forest backdrop with subtle champagne glow */
        body {
            background-color: #0B241C;
            background-image:
                radial-gradient(circle at 18% 12%, rgba(24, 71, 56, 0.55) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 42%),
                radial-gradient(circle at 50% 90%, rgba(6, 22, 17, 0.85) 0%, transparent 60%);
            color: #FAF6F0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .door-card {
            border: 1px solid rgba(212, 175, 55, 0.35);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s ease, box-shadow 0.35s ease;
        }

        .door-card:hover {
            transform: translateY(-3px);
            border-color: rgba(243, 229, 171, 0.85);
            box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.6), 0 0 18px rgba(212, 175, 55, 0.14);
        }

        .golden-door {
            background: linear-gradient(145deg, rgba(28, 66, 53, 0.95) 0%, rgba(11, 36, 28, 0.98) 55%, rgba(64, 51, 19, 0.88) 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.75);
            box-shadow: inset 0 0 22px rgba(212, 175, 55, 0.12);
        }

        @keyframes doorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .animate-shake {
            animation: doorShake 0.4s ease;
        }

        @keyframes cardReveal {
            0% { opacity: 0; transform: translateY(14px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-reveal {
            animation: cardReveal 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes vinylSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-disc {
            background:
                radial-gradient(circle at center, #FAF6F0 0 15%, #111614 15.5% 17%, #1c2421 17.5% 32%, #101513 32.5% 48%, #1c2421 48.5% 66%, #101513 66.5% 84%, #1c2421 84.5% 100%);
            animation: vinylSpin 9s linear infinite;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        .polaroid {
            background: #FFFFFF;
            padding: 10px 10px 28px 10px;
            box-shadow: 0 10px 25px rgba(11, 36, 28, 0.18);
            border: 1px solid #E5DCCB;
        }

        .voucher-card {
            background: linear-gradient(135deg, #FFFDF9 0%, #F5EFE4 100%);
            border: 1.5px dashed #B59024;
        }

        /* Special glow & shimmer for Day 24 (Christmas Eve) */
        @keyframes eveGlow {
            0%, 100% {
                box-shadow: 0 0 18px rgba(243, 229, 171, 0.25), inset 0 0 16px rgba(212, 175, 55, 0.14);
            }
            50% {
                box-shadow: 0 0 30px rgba(243, 229, 171, 0.52), inset 0 0 24px rgba(212, 175, 55, 0.28);
            }
        }

        .eve-special-box {
            background: radial-gradient(circle at top right, rgba(243, 229, 171, 0.22), transparent 55%),
                        linear-gradient(155deg, #102C23 0%, #091D17 65%, #2B210B 100%);
            border: 1px solid rgba(243, 229, 171, 0.65);
            animation: eveGlow 3.2s ease-in-out infinite;
        }

        /* Special royal aura & seal break for Day 25 (Christmas Day) */
        @keyframes xmasAura {
            0%, 100% {
                box-shadow: 0 0 24px rgba(212, 175, 55, 0.35), 0 0 48px rgba(243, 229, 171, 0.14);
            }
            50% {
                box-shadow: 0 0 38px rgba(243, 229, 171, 0.68), 0 0 68px rgba(212, 175, 55, 0.28);
            }
        }

        .xmas-special-box {
            background: radial-gradient(circle at 50% 0%, rgba(243, 229, 171, 0.28), transparent 60%),
                        linear-gradient(160deg, #173D30 0%, #0B241C 52%, #3A2C0E 100%);
            border: 1.5px solid rgba(243, 229, 171, 0.85);
            animation: xmasAura 2.8s ease-in-out infinite;
        }

        @keyframes sealPop {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            60% { transform: scale(1.18) rotate(8deg); opacity: 0.7; }
            100% { transform: scale(0.5) rotate(-12deg); opacity: 0; }
        }

        .seal-breaking {
            animation: sealPop 0.45s ease forwards;
            pointer-events: none;
        }

        /* Discreet almost-invisible creator dot */
        .secret-dot {
            opacity: 0.16;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .secret-dot:hover {
            opacity: 0.85;
            transform: scale(1.25);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #061611; }
        ::-webkit-scrollbar-thumb { background: #8E6F17; border-radius: 9999px; }
    </style>
</head>
<body class="antialiased selection:bg-gold-400 selection:text-forest-950">

    <!-- Hidden File Inputs -->

    <input type="file" id="maichiOutfitInput" accept="image/*" class="hidden">

    <!-- Minimal Toast -->

    <!-- Discreet Secret Trigger Dot in Top-Left Corner -->
    <button
        id="secretCreatorDot"
        type="button"
        onclick="openPinModal()"
        aria-label="Creator Access"
        class="secret-dot fixed top-3 left-3 z-30 w-2.5 h-2.5 rounded-full bg-gold-300 cursor-pointer focus:outline-none"
    ></button>

    <!-- Main Container -->
    <div class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 pt-8 pb-12">

            >
                <i data-lucide="snowflake" class="w-3.5 h-3.5 text-gold-300"></i>
                <span id="snowLabel">Snow</span>
            </button>

            <div class="flex items-center gap-2">
                <button
                    type="button"
                    onclick="openSummaryModal()"
                    class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-forest-950/70 hover:bg-forest-900 border border-gold-400/35 text-gold-200 text-xs font-medium transition"
                >
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-gold-300"></i>
                    <span>Keepsake</span>
                </button>

                <!-- Only visible once authenticated with PIN 0135 -->
                <button
                    id="creatorBadgeBtn"
                    type="button"
                    onclick="openCreatorPanel()"

                >
                    <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
                    <span>0135</span>
                </button>
            </div>
        </div>

        <!-- Crisp Editorial Header -->

            <p class="text-[11px] uppercase tracking-[0.28em] text-gold-300/85 mb-2">

            <h1 class="font-serif text-4xl sm:text-5xl font-bold tracking-tight text-gold-100">
                For Maichi
            </h1>
            <p class="mt-1.5 font-editorial italic text-lg text-ivory-200/80">
                From Embong
            </p>

            <!-- Compact Live Countdown -->
            <div class="mt-5 inline-flex items-center gap-3 px-4 py-2 rounded-full bg-forest-950/65 border border-gold-400/25 text-xs text-ivory-200/90">
                <span class="text-gold-300 font-medium">Dec 25</span>
                <span class="text-gold-400/40">&bull;</span>
                <span id="liveCountdownText" class="font-mono tracking-wider text-gold-100">00d 00h 00m 00s</span>
            </div>
        </header>

        <!-- 25-Day Advent Grid -->
        <main>
            <div id="calendarGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3 sm:gap-4"></div>
        </main>

        <!-- Minimal Footer -->
        <footer class="mt-10 pt-5 border-t border-gold-400/15 flex items-center justify-between text-xs text-ivory-300/60">

    </div>

    <!-- Day Card Modal -->
    <div id="dayModal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-forest-950/80 backdrop-blur-md">

                <button type="button" onclick="closeDayModal()" class="p-1.5 rounded-full hover:bg-ivory-200 text-forest-900 transition" aria-label="Close">

            <div id="dayModalContent" class="space-y-4 text-sm sm:text-base text-forest-900/90 leading-relaxed"></div>
        </div>
    </div>

    <!-- Keepsake & Notes Modal -->
    <div id="summaryModal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-forest-950/80 backdrop-blur-md">
        <div class="card-reveal relative w-full max-w-lg max-h-[88vh] overflow-y-auto rounded-3xl bg-ivory-100 text-forest-950 border border-gold-400/80 shadow-2xl p-6 sm:p-7">

                    <span>Send to Embong</span>

    <!-- PIN Modal (Code: 0135) -->
    <div id="pinModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-forest-950/85 backdrop-blur-md">

            <input

                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="&bull;&bull;&bull;&bull;"
                onkeydown="if (event.key === 'Enter') verifyPinCode();"

            <div class="mt-5 pt-3 border-t border-gold-400/20 flex justify-end">

                    Lock 0135

            </div>
        </div>
    </div>

        function recordActivity(action, day = null, detail = "") {

            state.logs.unshift(entry);
            if (state.logs.length > 250) {

            saveState();
            sendAutoFormspreeLog(entry);
            if (creatorAuthenticated) {

        function sendAutoFormspreeLog(entry) {
            if (!FORMSPREE_ENDPOINT) return;
            try {
                fetch(FORMSPREE_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        _subject: `[Maichi Advent] ${entry.day} — ${entry.action}`,
                        recipient: "Maichi",
                        sender: "Embong",
                        notifyEmail: EMBONG_EMAIL,
                        time: entry.time,
                        day: entry.day,
                        action: entry.action,
                        detail: entry.detail || ""
                    })
                }).catch(() => {});
            } catch (err) {
                console.error("Formspree auto-send failed:", err);
            }
        }

        function openMediaDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function putMedia(key, dataUrl) {
            try {
                const db = await openMediaDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(DB_STORE, "readwrite");
                    tx.objectStore(DB_STORE).put(dataUrl, key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (err) {
                console.error("Media save failed:", err);
            }
        }

        async function getMedia(key) {
            try {
                const db = await openMediaDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(DB_STORE, "readonly");
                    const req = tx.objectStore(DB_STORE).get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                return null;
            }
        }

        async function clearMediaDB() {
            try {
                const db = await openMediaDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(DB_STORE, "readwrite");
                    tx.objectStore(DB_STORE).clear();
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (err) {
                console.error("Media clear failed:", err);
            }
        }

        /* =====================================================================
         * IMAGE COMPRESSION FOR POLAROIDS & VINYL COVERS
         * ===================================================================== */
        function compressImageFile(file, maxSide = 900, quality = 0.82) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxSide || height > maxSide) {
                            if (width > height) {
                                height = Math.round((height * maxSide) / width);
                                width = maxSide;
                            } else {
                                width = Math.round((width * maxSide) / height);
                                height = maxSide;
                            }
                        }
                        const c = document.createElement("canvas");
                        c.width = width;
                        c.height = height;
                        const cctx = c.getContext("2d");
                        cctx.drawImage(img, 0, 0, width, height);
                        resolve(c.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = reject;
                    img.src = evt.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        /* =====================================================================
         * DATE UNLOCK LOGIC & COUNTDOWN
         * ===================================================================== */
        function getEffectiveDecemberDay() {
            if (state.simulatedDay) return Number(state.simulatedDay);
            const now = new Date();
            if (now.getMonth() === 11) return now.getDate();
            return 0;
        }

        function isDayOpenable(dayNum) {
            if (creatorAuthenticated && state.unlockAllTest) return true;
            const effDay = getEffectiveDecemberDay();
            return effDay >= dayNum && dayNum <= 25;
        }

        function startCountdown() {
            const targetEl = document.getElementById("liveCountdownText");
            function update() {
                const now = new Date();
                let year = now.getFullYear();
                if (now.getMonth() === 11 && now.getDate() > 25) year += 1;
                const xmas = new Date(year, 11, 25, 0, 0, 0);
                const diff = Math.max(0, xmas - now);

                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);

                targetEl.textContent = `${String(d).padStart(2, "0")}d ${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
            }
            update();
            setInterval(update, 1000);
        }

                                class="mx-auto inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-gold-400 hover:bg-gold-300 text-forest-950 text-xs font-bold shadow-lg transition"
                            >
                                <i data-lucide="sparkles" class="w-4 h-4"></i>
                                <span>Break Golden Seal</span>
                            </button>
                        </div>
                        <div id="xmasSecretLetter" class="space-y-3">
                            <p class="font-editorial italic text-xl leading-relaxed text-gold-100">${escapeHtml(item.note)}</p>
                            <button type="button" onclick="spawnGoldBurst(); spawnChristmasStarShower();" class="px-4 py-1.5 rounded-full bg-gold-400/90 hover:bg-gold-300 text-forest-950 text-xs font-bold transition">
                                ✦
                            </button>
                        </div>
                    </div>
                `;
            } else {
                body.innerHTML = `
                    <div class="p-5 rounded-2xl bg-white/80 border border-gold-400/30">
                        <p class="font-editorial italic text-xl text-forest-950">${escapeHtml(item.note)}</p>
                    </div>
                `;
            }

            modal.classList.remove("hidden");
            modal.classList.add("flex");
            lucide.createIcons();
        }

        function closeDayModal() {
            const modal = document.getElementById("dayModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        /* =====================================================================
         * INTERACTION HANDLERS (RESPONSES, VOUCHERS, RSVP, MAILTO, CLIPBOARD)
         * ===================================================================== */
        function pickOption(opt) {
            const input = document.getElementById("replyField");
            if (!input) return;
            const current = input.value.trim();
            const cleaned = current.replace(/^(Red & White|All Black|Gold)(\s*•\s*)?/, "");
            input.value = cleaned ? `${opt} • ${cleaned}` : opt;

            document.querySelectorAll(".opt-chip").forEach((el) => {
                if (el.textContent.trim() === opt) {
                    el.className = "opt-chip px-3 py-1.5 rounded-full text-xs font-semibold border transition bg-forest-900 text-gold-200 border-forest-900";
                } else {
                    el.className = "opt-chip px-3 py-1.5 rounded-full text-xs font-semibold border transition bg-white hover:bg-ivory-200 text-forest-900 border-gold-400/50";
                }
            });
        }

        function saveAndMailReply(dayNum) {
            const item = ADVENT_DAYS.find((d) => d.day === dayNum);
            const input = document.getElementById("replyField");
            const val = input ? input.value.trim() : "";
            if (!val) {
                showToast("Write something first");
                return;
            }
            state.responses[dayNum] = val;
            recordActivity("Saved reply", dayNum, val);
            renderGrid();
            openMailTo(
                `[Maichi Dec ${String(dayNum).padStart(2, "0")}] ${item.title}`,
                `Day ${String(dayNum).padStart(2, "0")} - ${item.title}\n\n${val}\n\n— Maichi`
            );
        }

        let rsvpSelected = false;
        function toggleRsvpButton() {
            rsvpSelected = !rsvpSelected;
            const btn = document.getElementById("rsvpToggleBtn");
            if (!btn) return;
            btn.className = rsvpSelected
                ? "w-full py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-forest-900 text-gold-200 border-forest-900"
                : "w-full py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-white hover:bg-ivory-50 text-forest-950 border-gold-400";
            btn.textContent = rsvpSelected ? "See You There ✓" : "Count Me In";
        }

        function saveAndMailRsvp() {
            const input = document.getElementById("replyField");
            const note = input ? input.value.trim() : "";
            const confirmed = rsvpSelected || (state.responses[24] || "").startsWith("Yes");
            const summary = confirmed ? (note ? `Yes • ${note}` : "Yes") : note;

            if (!summary) {
                showToast("Tap Count Me In or add a note");
                return;
            }

            state.responses[24] = summary;
            recordActivity("RSVP Dec 24", 24, summary);
            renderGrid();
            openMailTo("[Maichi Dec 24] Christmas Eve", `Christmas Eve RSVP: ${summary}\n\n— Maichi`);
        }

        function copyDayReply(dayNum) {
            const item = ADVENT_DAYS.find((d) => d.day === dayNum);
            const input = document.getElementById("replyField");
            const val = (input && input.value.trim()) || state.responses[dayNum] || "";
            if (!val) {
                showToast("Nothing to copy");
                return;
            }
            copyToClipboard(`Day ${String(dayNum).padStart(2, "0")} (${item.title}): ${val}`);
            showToast("Copied");
        }

        function toggleVoucher(dayNum) {
            const idx = state.redeemedVouchers.indexOf(dayNum);
            if (idx === -1) {
                state.redeemedVouchers.push(dayNum);
                recordActivity("Redeemed voucher", dayNum, "Used");
                showToast("Redeemed");
            } else {
                state.redeemedVouchers.splice(idx, 1);
                recordActivity("Unredeemed voucher", dayNum, "Reset");
                showToast("Reset");
            }
            const item = ADVENT_DAYS.find((d) => d.day === dayNum);
            openDayModal(item);
        }

        function openMailTo(subject, body) {
            window.location.href = `mailto:${EMBONG_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        /* =====================================================================
         * KEEPSAKE SUMMARY MODAL
         * ===================================================================== */
        function openSummaryModal() {
            const modal = document.getElementById("summaryModal");
            const container = document.getElementById("summaryItems");
            const rows = [];

            ADVENT_DAYS.forEach((d) => {
                const tag = `Day ${String(d.day).padStart(2, "0")}`;
                if (state.responses[d.day]) {
                    rows.push(`<div class="p-3 rounded-xl bg-white border border-gold-400/30"><span class="text-xs font-bold text-forest-950">${tag} &bull; ${escapeHtml(d.title)}</span><p class="text-sm text-forest-900 mt-0.5">${escapeHtml(state.responses[d.day])}</p></div>`);
                }
                if (state.redeemedVouchers.includes(d.day)) {
                    rows.push(`<div class="p-3 rounded-xl bg-ivory-200/80 border border-gold-400/30"><span class="text-xs font-bold text-forest-950">${tag} &bull; ${escapeHtml(d.title)}</span><p class="text-xs text-gold-600 font-semibold mt-0.5">Voucher Redeemed</p></div>`);
                }
            });

            container.innerHTML = rows.length
                ? rows.join("")
                : `<p class="text-sm text-forest-800/70 text-center py-6">No saved notes yet.</p>`;

            modal.classList.remove("hidden");
            modal.classList.add("flex");
            lucide.createIcons();
        }

        function closeSummaryModal() {
            const modal = document.getElementById("summaryModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function buildSummaryDigest() {
            const lines = ["Maichi — December Notes", ""];
            ADVENT_DAYS.forEach((d) => {
                const tag = `Day ${String(d.day).padStart(2, "0")}`;
                if (state.responses[d.day]) {
                    lines.push(`${tag} (${d.title}): ${state.responses[d.day]}`);
                }
                if (state.redeemedVouchers.includes(d.day)) {
                    lines.push(`${tag} (${d.title}): Voucher Redeemed`);
                }
            });
            return lines.join("\n");
        }

        function copySummaryText() {
            copyToClipboard(buildSummaryDigest());
            showToast("Copied");
        }

        function mailSummaryToEmbong() {
            recordActivity("Sent summary email", null, "Manual mailto");
            openMailTo("[Maichi Advent] Notes & Vouchers", buildSummaryDigest());
        }

        /* =====================================================================
         * CREATOR PASSCODE "0135" & HIDDEN CONTROLS
         * ===================================================================== */
        function openPinModal() {
            if (creatorAuthenticated) {
                openCreatorPanel();
                return;
            }
            const modal = document.getElementById("pinModal");
            const input = document.getElementById("pinInput");
            input.value = "";
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            setTimeout(() => input.focus(), 50);
        }

        function closePinModal() {
            const modal = document.getElementById("pinModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function verifyPinCode() {
            const input = document.getElementById("pinInput");
            if (input.value.trim() === CREATOR_PIN) {
                creatorAuthenticated = true;
                closePinModal();
                document.getElementById("creatorBadgeBtn").classList.remove("hidden");
                document.getElementById("creatorBadgeBtn").classList.add("inline-flex");
                recordActivity("Creator unlocked", null, "PIN 0135");
                renderGrid();
                openCreatorPanel();
            } else {
                input.value = "";
                showToast("Invalid code");
            }
        }

        function lockCreatorSession() {
            creatorAuthenticated = false;
            closeCreatorPanel();
            document.getElementById("creatorBadgeBtn").classList.add("hidden");
            document.getElementById("creatorBadgeBtn").classList.remove("inline-flex");
            renderGrid();
            showToast("Locked");
        }

        function openCreatorPanel() {
            if (!creatorAuthenticated) {
                openPinModal();
                return;
            }
            document.getElementById("unlockAllToggle").checked = Boolean(state.unlockAllTest);
            document.getElementById("simDaySelect").value = state.simulatedDay ? String(state.simulatedDay) : "";
            renderVinylEditors();
            renderActivityLogs();

            const modal = document.getElementById("creatorModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            lucide.createIcons();
        }

        function closeCreatorPanel() {
            const modal = document.getElementById("creatorModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function toggleUnlockAll(checked) {
            state.unlockAllTest = checked;
            saveState();
            renderGrid();
        }

        function setSimulatedDay(val) {
            state.simulatedDay = val ? Number(val) : null;
            saveState();
            renderGrid();
        }

        function renderVinylEditors() {
            const list = document.getElementById("vinylEditorList");
            const vinylDays = ADVENT_DAYS.filter((d) => d.type === "vinyl");
            list.innerHTML = vinylDays.map((d) => `
                <div class="flex flex-col sm:flex-row sm:items-center gap-2 bg-forest-900/70 p-2.5 rounded-xl border border-gold-400/15">
                    <span class="font-mono text-xs text-gold-300 shrink-0 w-16">Day ${String(d.day).padStart(2, "0")}</span>
                    <input
                        id="vinylUrl_${d.day}"
                        type="url"
                        value="${escapeAttr(state.vinylLinks[d.day] || d.defaultUrl)}"
                        placeholder="https://..."
                        class="flex-1 rounded-lg bg-forest-950 border border-gold-400/30 px-2.5 py-1.5 text-xs text-ivory-100 focus:outline-none"
                    >
                    <button
                        type="button"
                        onclick="triggerVinylCoverUpload(${d.day})"
                        class="px-2.5 py-1.5 rounded-lg bg-forest-800 hover:bg-forest-700 text-gold-200 text-xs shrink-0 transition"
                    >
                        Cover
                    </button>
                </div>
            `).join("");
        }

        function saveCreatorMediaSettings() {
            [2, 12, 19].forEach((dayNum) => {
                const input = document.getElementById(`vinylUrl_${dayNum}`);
                if (input && input.value.trim()) {
                    state.vinylLinks[dayNum] = input.value.trim();
                }
            });
            saveState();
            showToast("Saved");
        }

        function triggerPolaroidUpload(dayNum) {
            pendingMediaTarget = { kind: "polaroid", day: dayNum };
            document.getElementById("polaroidInput").click();
        }

        function triggerVinylCoverUpload(dayNum) {
            pendingMediaTarget = { kind: "vinyl", day: dayNum };
            document.getElementById("vinylCoverInput").click();
        }

        document.getElementById("polaroidInput").addEventListener("change", async function (e) {
            const file = e.target.files[0];
            if (!file || !pendingMediaTarget) return;
            try {
                const compressed = await compressImageFile(file, 900, 0.82);
                await putMedia(`polaroid_${pendingMediaTarget.day}`, compressed);
                showToast(`Day ${String(pendingMediaTarget.day).padStart(2, "0")} photo saved`);
            } catch (err) {
                showToast("Image error");
            }
            e.target.value = "";
            pendingMediaTarget = null;
        });

        document.getElementById("vinylCoverInput").addEventListener("change", async function (e) {
            const file = e.target.files[0];
            if (!file || !pendingMediaTarget) return;
            try {
                const compressed = await compressImageFile(file, 450, 0.82);
                await putMedia(`vinyl_cover_${pendingMediaTarget.day}`, compressed);
                showToast(`Day ${String(pendingMediaTarget.day).padStart(2, "0")} cover saved`);
            } catch (err) {
                showToast("Cover error");
            }
            e.target.value = "";
            pendingMediaTarget = null;
        });

        document.getElementById("maichiOutfitInput").addEventListener("change", async function (e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const compressed = await compressImageFile(file, 900, 0.82);
                await putMedia("maichi_outfit_5", compressed);
                recordActivity("Uploaded outfit photo", 5, "Maichi look");
                showToast("Photo saved");
                const item = ADVENT_DAYS.find((d) => d.day === 5);
                if (item) openDayModal(item);
            } catch (err) {
                showToast("Upload error");
            }
            e.target.value = "";
        });

        function renderActivityLogs() {
            const list = document.getElementById("activityLogList");
            document.getElementById("logCountSpan").textContent = String(state.logs.length);

            if (!state.logs.length) {
                list.innerHTML = `<div class="text-ivory-300/50 py-2">No activity recorded yet.</div>`;
                return;
            }

            list.innerHTML = state.logs.map((l) => `
                <div class="py-1 border-b border-gold-400/10 last:border-none text-ivory-200/85">
                    <span class="text-gold-300">${escapeHtml(l.time)}</span>
                    <span class="text-ivory-100 font-semibold">[${escapeHtml(l.day)}]</span>
                    <span>${escapeHtml(l.action)}</span>
                    ${l.detail ? `<span class="text-gold-200/80">— ${escapeHtml(l.detail)}</span>` : ""}
                </div>
            `).join("");
        }

        function formatLogsPlain() {
            const lines = ["Maichi Advent Activity Log", ""];
            state.logs.forEach((l) => {
                lines.push(`${l.time} | ${l.day} | ${l.action}${l.detail ? " | " + l.detail : ""}`);
            });
            return lines.join("\n");
        }

        function exportLogsJson() {
            copyToClipboard(formatLogsPlain());
            showToast("Log copied");
        }

        function mailLogsToEmbong() {
            openMailTo("[Maichi Advent] Activity Log", formatLogsPlain());
        }

        async function clearAllStoredData() {
            state.openedDays = [];
            state.responses = {};
            state.redeemedVouchers = [];
            state.logs = [];
            saveState();
            await clearMediaDB();
            renderGrid();
            renderActivityLogs();
            showToast("Cleared");
        }

        /* =====================================================================
         * CANVAS SNOWFALL EFFECT
         * ===================================================================== */
        const canvas = document.getElementById("snowCanvas");
        const ctx = canvas.getContext("2d");
        let flakes = [];
        let bursts = [];

        function resizeSnowCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initFlakes() {
            const total = Math.min(75, Math.floor((window.innerWidth * window.innerHeight) / 16000));
            flakes = [];
            for (let i = 0; i < total; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2.1 + 0.7,
                    vy: Math.random() * 0.6 + 0.25,
                    vx: (Math.random() - 0.5) * 0.3,
                    gold: Math.random() < 0.22,
                    a: Math.random() * 0.55 + 0.25
                });
            }
        }

        function toggleSnow() {
            state.snowEnabled = !state.snowEnabled;
            saveState();
            document.getElementById("snowLabel").textContent = state.snowEnabled ? "Snow" : "Off";
        }

        function spawnGoldBurst() {
            for (let i = 0; i < 45; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1.2;
                bursts.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    r: Math.random() * 2.5 + 1,
                    life: 1
                });
            }
        }

        /* Warm rising golden embers/lantern sparks for Day 24 (Christmas Eve) */
        function spawnLanternDrift() {
            for (let i = 0; i < 28; i++) {
                bursts.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height - Math.random() * 60,
                    vx: (Math.random() - 0.5) * 1.1,
                    vy: -(Math.random() * 1.8 + 0.9),
                    r: Math.random() * 2.8 + 1.4,
                    life: 1
                });
            }
        }

        /* Radiant star shower across the canvas for Day 25 (Christmas Day) */
        function spawnChristmasStarShower() {
            for (let i = 0; i < 65; i++) {
                const spreadX = Math.random() * canvas.width;
                const startY = Math.random() * (canvas.height * 0.45);
                bursts.push({
                    x: spreadX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 2.4,
                    vy: Math.random() * 2.2 + 0.8,
                    r: Math.random() * 3.2 + 1.2,
                    life: 1
                });
            }
        }

        /* Interactive golden seal reveal inside Day 25 */
        function breakChristmasSeal() {
            const seal = document.getElementById("xmasSealLayer");
            if (seal) {
                seal.classList.add("seal-breaking");
                setTimeout(() => {
                    seal.classList.add("hidden");
                }, 440);
            }
            recordActivity("Broke Day 25 seal", 25, "Secret gift hint revealed");
            spawnGoldBurst();
            spawnChristmasStarShower();
        }

        function renderSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (state.snowEnabled) {
                flakes.forEach((f) => {
                    f.y += f.vy;
                    f.x += f.vx;
                    if (f.y > canvas.height) {
                        f.y = -4;
                        f.x = Math.random() * canvas.width;
                    }
                    if (f.x > canvas.width) f.x = 0;
                    if (f.x < 0) f.x = canvas.width;

                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                    ctx.fillStyle = f.gold
                        ? `rgba(243, 229, 171, ${f.a})`
                        : `rgba(250, 246, 240, ${f.a * 0.7})`;
                    ctx.fill();
                });
            }

            bursts = bursts.filter((b) => b.life > 0.02);
            bursts.forEach((b) => {
                b.x += b.vx;
                b.y += b.vy;
                b.vy += 0.06;
                b.life *= 0.96;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${b.life})`;
                ctx.fill();
            });

            requestAnimationFrame(renderSnow);
        }

        /* =====================================================================
         * HELPERS & BOOTSTRAP
         * ===================================================================== */
        function showToast(msg) {
            const box = document.getElementById("toastBox");
            const el = document.createElement("div");
            el.className = "px-4 py-2 rounded-full bg-forest-950/95 border border-gold-400/60 text-gold-100 text-xs font-medium shadow-xl transition-opacity duration-300";
            el.textContent = msg;
            box.appendChild(el);
            setTimeout(() => {
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 300);
            }, 2200);
        }

        function copyToClipboard(text) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand("copy");
            } catch (e) {
                console.error(e);
            }
            document.body.removeChild(ta);
        }

        function escapeHtml(s) {
            if (!s) return "";
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function escapeAttr(s) {
            return escapeHtml(s).replace(/'/g, "&#39;");
        }

        function escapeJs(s) {
            return String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        }

        function populateSimDayOptions() {
            const sel = document.getElementById("simDaySelect");
            for (let d = 1; d <= 25; d++) {
                const opt = document.createElement("option");
                opt.value = String(d);
                opt.textContent = `Dec ${String(d).padStart(2, "0")}`;
                sel.appendChild(opt);
            }
        }

        window.addEventListener("resize", () => {
            resizeSnowCanvas();
            initFlakes();
        });

        window.onload = function () {
            loadState();
            populateSimDayOptions();
            document.getElementById("snowLabel").textContent = state.snowEnabled ? "Snow" : "Off";
            renderGrid();
            startCountdown();
            resizeSnowCanvas();
            initFlakes();
            renderSnow();
            lucide.createIcons();
        };
    </script>
</body>
